name: Daily briefing (safety net)

on:
  schedule:
    # 00:30 UTC = 06:00 IST, every day
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's briefing if missing
        run: python scripts/fetch_wikipedia.py

      - name: Rebuild the site
        run: python scripts/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "on-this-day-bot"
          git config user.email "on-this-day-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Daily briefing: $(date -u +%Y-%m-%d)"
          git push
